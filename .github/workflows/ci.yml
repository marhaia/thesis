name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Smoke & regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        env:
          # This smoke job intentionally omits the frozen heavy production
          # stack. Responses expose this bypass as not_verified; the production
          # default remains strict full-lock verification.
          STAGE1_RUNTIME_VERIFICATION: metadata_only
        # Runs the CI-light-safe test files only (smoke + canonical-scale +
        # canonical visual-norm generator + production saliency postprocessing
        # + active-claim reconciliation).
        # These are NOT the entire repository test suite:
        # cognitive/test_jokinen.py, tests/test_pipeline.py and
        # saliency/test_full_pipeline.py exist too but need the heavy ML stack
        # and are not run in this lightweight job.
        run: python -m pytest tests/test_smoke.py tests/test_canonical_scale.py tests/test_canonical_visual_norms.py tests/test_saliency_postprocessing.py tests/test_umsi_production_postprocess_gate.py tests/test_stage1_contract.py tests/test_layout_fail_closed.py tests/test_scientific_semantics.py tests/test_hceye_coefficient_provenance.py tests/test_umsi_checkpoint_identity.py tests/test_stage1_reproducibility.py tests/test_claim_reconciliation.py -q

  deps-check:
    name: Full requirements resolve (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Dry-run resolve the full runtime stack
        # Catches real dependency conflicts (e.g. an incompatible numpy/opencv
        # pin) without downloading the multi-hundred-MB ML wheels.
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt
